[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escah-pipeline"
version = "0.1.0"
description = "超昂大戦 WIKI 中日双语镜像数据流水线（抓取 / 解析 / 翻译 / 生成）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.scripts]
escah-pipeline = "escah_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["escah_pipeline*"]
