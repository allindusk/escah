# 「原样镜像」页里其余文本的**人工译文**（2026-09-30）。
#
# 用户要求："不需要做词表，词表上没有的你直接翻译就行，又没有多少文本，
# 这些页面可能两三年才更新一次" ✓ —— 所以这里是**逐条直接翻译的结果** ✓，
# 不是通用词表 ✓（通用术语仍走 glossary/ 与 stat_labels.yaml ✓）。
#
# 为什么还需要单独一份：镜像页覆盖**全部工作表** ✓（宝箱包 33 个 ✓），
# 而之前只翻译过"数据统计页用到的那几张" ✓；剩下 24 种（34 处）都是同一内容的
# **空格/标点变体** ✗（全角空格 `　` ✓、句末 `。` ✓、被 `<br>` 拆成两段 ✓），
# 精确匹配没命中 ✓。键**必须原样保留空格** ✗（不要 strip ✗）。
