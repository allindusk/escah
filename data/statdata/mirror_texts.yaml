  # ---- 2026-11-24 统计页说明补译
  "・自動配置と手動操作の比較では、結果に違いがでない項目（パネルをセットしないもの等）は、比較することに意味はあまりないと思います": ・在自动配置与手动操作的比较中，结果不产生差异的项目（如不装面板的项目等），比较起来意义不大。
  "・宝箱を開封し、さらに得た宝箱から、合計で実質何をどの程度得られるか": ・开箱后，再从获得的宝箱中，合计实际能拿到什么、拿到多少。
  "・宝箱を消費して、トークンを獲得できます（1個10箱。月に100個までなので1000箱まで消費できる）": ・消耗宝箱可获得代币（1 个 10 箱。每月最多 100 个，因此最多可消耗 1000 箱）。
  "・宝箱を消費して、全知全能の白鯨を獲得できます（1匹400箱）": ・消耗宝箱可获得全知全能的白鲸（1 头 400 箱）。
  "・確認したいステージの枠は増やすことができます。最後の行を選択して上に1行挿入": ・想确认的关卡栏位可以增加。选中最后一行，在上方插入 1 行。
  "※実際は宝箱開封で入手できるスタミナを使って宝箱を再度入手できるので、もう少し増えます": ※实际上用开箱获得的体力还能再取得宝箱，所以会再多一些。
  "・開封方法で違いが出ない項目の獲得数の振れ幅で、主要な獲得物の計算に差が生じます。なので、": ・由于「开箱方式不产生差异的项目」获得数的波动幅度，会让主要获得物的计算出现差异。因此，
  "開封方法で違いが出ない項目を全ての開封結果から平均を出して、主要な獲得物の計算をするかを選択します": 需选择是否取所有开箱结果中「开箱方式不产生差异的项目」的平均值，来计算主要获得物。
  "・リセットストラップの使用先を選択し、1つ当たりの獲得物の個数を入力します": ・选择重置挂带的使用去向，并输入每个的获得物个数。
  "・逞しきドロップの使用の是非を選択し、1つ当たりの獲得物の個数を入力します": ・选择是否使用「茁壮掉落」，并输入每个的获得物个数。
  "・個人的に宝箱開封は、手動操作であればラジオや音声作品、自動配置であれば動画を見ながらがお勧めです": ・个人建议：开箱时，手动操作可以边听广播或音声作品，自动配置可以边看视频。
  "・特にののののASMR。めちゃ最高といっても過言ではありません。聞くことをお勧めします": ・尤其是诺诺诺的 ASMR。说是最棒也不为过。推荐一听。
  "１．M1-12-10で使うスタミナを2-8で使用すれば7.73個宝箱を獲得出来る": 1. 把 M1-12-10 要用的体力拿去 2-8 使用，可获得 7.73 个宝箱。
  "２．M1-12-10で逞しきドロップを使用して得ることができる箱数は19.3個": 2. 在 M1-12-10 使用「茁壮掉落」可获得的箱数为 19.3 个。
  "１．E1-6で使うスタミナを2-8で使用すれば12.36個宝箱を獲得出来る": 1. 把 E1-6 要用的体力拿去 2-8 使用，可获得 12.36 个宝箱。
  "２．E1-6で逞しきドロップを使用して得ることができる箱数は43.3個": 2. 在 E1-6 使用「茁壮掉落」可获得的箱数为 43.3 个。
  "・レベルアップした時は経験値の数値が計測前よりも小さくなると思うので、調整が必要です": ・升级时经验值数字会比计测前变小，因此需要调整。
  "・資金の獲得量はVIPランクにより、パネルの回転に使う資金で違いが出ます": ・资金获得量会因 VIP 等级以及用于转面板的资金而不同。
  "・集計データは100回まで計測できます(1,000箱×100回でMAX:100,000箱)": ・统计数据最多可计测 100 次（1,000 箱×100 次为上限：100,000 箱）。
  "※自動配置する場合は完全にQuickボタン押下のみを行った場合を検証しています（ブレイキングバットは除外）": ※自动配置时，验证的是完全只按 Quick 按钮的情况（不含破坏球棒）。
  "前提条件シートから複数のシートで参照する為の文言やフォーモットを分離するように変更": 已改为把「从前提条件表被多张表引用所需的文案与格式」分离出来。
  "開封操作や設定の違いによる計測結果の比較を合計で行うと、開封数が異なる場合に意味がないので削除": 由于把开箱操作或设置差异的计测结果合计比较时，开箱数不同就没有意义，故删除。
  "開封操作や設定の違いによる計測結果を、プルダウンリストで選択して比較できるように変更": 已改为可用下拉列表选择并比较开箱操作或设置差异的计测结果。
  "自動配置と手動操作で違いが出ない項目の平均を出して、1蝶鉱石当たりの宝箱数の計算を出す機能をなんとなく削除（考慮の余地あり）": 已大致删除「对自动配置与手动操作不产生差异的项目取平均，计算每 1 蝶矿石的宝箱数」的功能（仍有考虑余地）。
  "開封操作や設定の違いによる開封結果の１項目をプルダウンリストで選択して、グラフを表示して比較できる機能を追加": 新增功能：可用下拉列表选择开箱操作或设置差异的开箱结果中的某一项，以图表显示并比较。
  "何箱開封すれば1蝶鉱石が得られるかをグラフを表示して比較できる機能を追加": 新增功能：以图表显示并比较开多少箱可获得 1 蝶矿石。
  "スタミナ半減キャンペーンの適応を指定したクエストで適応外にしていた処理を、適応するかフラグを設けて判断する処理に変更": 已把「体力减半活动中指定关卡适用、其他不适用」的处理，改为设置适用与否的标志来判断。
  "検証ステージの追加枠にステージを追加しても、プルダウンリストで選択できない不具合を修正": 修复了在验证关卡追加栏位中加入关卡后，无法从下拉列表选择的故障。
  "自動配置のクイック設定を強化ポイントを全配置に設定して5000箱計測": 自动配置的快速设置将强化点设为全配置，计测 5000 箱。
  "開封箱数をリストから入力するように変更（グラフに結果を表示する都合上、開封箱数は1000固定であることが良いため）": 已改为从列表输入开箱数（因为要在图表中显示结果，开箱数固定为 1000 较好）。
  "ミッションで取得したG・愛・情から獲得できる覚醒ポイントが計算に含まれていない不具合を修正": 修复了任务中取得的 G・爱・情所能获得的觉醒点未计入计算的故障。
  "主要な獲得物の表が形式を変えて2重に同じ内容が用意されていたので片方を削除": 主要获得物表因格式变更而存在两份相同内容，故删除其中一份。
  "全知全能の白鯨の割引キャンペーンを考慮して、効率を比較できるように変更": 已改为考虑全知全能的白鲸折扣活动，可比较效率。
  "自分で検証していない内容が含まれており（しかも無断なのは良くない）、それは情報の信頼度に欠けるので該当箇所を削除": 内容中含有我自己未验证的部分（而且未经许可也不妥），缺乏信息可信度，故删除相关部分。
  "開封操作と全知全能の白鯨の強化ポイントの取得量の比較を全知全能の白鯨を基準とするように変更": 已改为以全知全能的白鲸为基准，比较开箱操作与全知全能的白鲸强化点获取量。
  "検証回数21~29回が開封箱数のリストが設定されないない不具合を修正": 修复了验证次数 21～29 次时开箱数列表未被设置的故障。
  "集計結果の合計の集計範囲が検証回数20回までになっていたため、100回までに修正": 统计结果的合计范围原本只到验证次数 20 次，已修正为 100 次。
  "入力ミスの発見用に条件付き書式を設定（結果が0未満なら赤背景）": 为便于发现输入错误设置了条件格式（结果小于 0 则红底）。
  "アニバーサリーイベントの宝箱クエストのドロップの価値について記載": 已记载周年活动宝箱任务的掉落价值。
  "1000箱開封結果のグラフに手動開封の結果が表示されていなかった問題を修正": 修复了 1000 箱开箱结果图表中未显示手动开箱结果的问题。
  "前提条件シートでリセットストラップの使用先を選択した場合に、特定の場合にエラーになる不具合を修正": 修复了在前提条件表选择重置挂带使用去向时，特定情况下会出错的故障。
  "イベントクエストを考慮していなかった為、時短戦闘をすると茶ハニーが出現するように計算していたのを修正。": 因未考虑活动任务，导致扫荡战斗时会计算成出现茶哈妮，已修正。
  "・異なる設定での自動配置や、手動操作を行った場合の開封結果を平均を出して比較します": ・对不同设置下的自动配置、以及手动操作的开箱结果取平均进行比较。
  "・蝶鉱石を使用してのスタミナ回復を行った場合の効率を上記の計算結果を元に計算します": ・使用蝶矿石回复体力时的效率，基于上述计算结果计算。
  "・交換所で宝箱を全知全能の白鯨と交換した時の効率を宝箱を開封した場合と比較します": ・把在交换所用宝箱兑换全知全能的白鲸时的效率，与直接开箱的情况比较。
  "・自身のプレイスタイルや、何をもって合理的と判断するかは人によって異なります": ・自己的游玩风格、以及以什么判断为合理，因人而异。
  "※すでに私が集計したデータを入力済みなので、今の状態でもある程度の傾向は分かりますが、データ数が増えればより精度が高くなると思います": ※由于已经输入了我统计的数据，现在也能看出一定倾向，但数据越多精度会越高。
  "※集計データを見れば分かりますが、上振れ下振れが結構あります。なので現状では正確な数値が出ていない可能性があります。要試行回数": ※看统计数据就能明白，上下波动相当大。因此目前可能还得不出准确数值。需要试验次数。
  "・プルダウンリストから確認したい項目を選択すれば、結果が表示されます": ・从下拉列表选择想确认的项目，就会显示结果。
  "・グラフに表示したくない開封方法は結果(雛形：変更禁止)に設定すれば、表示されなくなります": ・不想在图表中显示的开箱方式，设为「结果（雏形：禁止修改）」后就不会显示。
  "・集計シート名や結果シート名を変更した場合は必ずこちらも変更します": ・若更改了统计表名或结果表名，此处也必须同步更改。
  "・新たな計測を行うためにシートを追加する場合は以下の手順の操作を行います": ・若要新增工作表进行新的计测，请按以下步骤操作。
  "3-2.背景が紫色のセルのプルダウンリストから追加した集計シート名を選択": 3-2. 从背景为紫色的单元格下拉列表中选择新增的统计表名。
  "4-2.挿入した列を選択して貼り付け、その列のプルダウンリストから追加した結果シート名を選択": 4-2. 选中插入的列并粘贴，再从该列的下拉列表中选择新增的结果表名。
  "5-2.挿入した行を選択して貼り付け、その行のプルダウンリストから追加した結果シート名を選択": 5-2. 选中插入的行并粘贴，再从该行的下拉列表中选择新增的结果表名。
  "タツノオトシドコロを売却した場合、覚醒ポイントの計算の考慮が無い為追加": 追加了出售龙落子时未考虑觉醒点计算的处理。
  "DENAIから入手できる覚醒ポイントが、突破ポイントに加算されている不具合を修正": 修复了从 DENAI 可获得的觉醒点被计入突破点的故障。
  "※集計結果が偏っている可能性はあります（あくまで参考程度でお願いします）": ※统计结果可能存在偏差（仅供参考）。
  "※ミスがあったらごめんなさい（めっちゃ優しく教えて頂けると助かります）": ※若有错误还请见谅（能温柔地指正就太好了）。
