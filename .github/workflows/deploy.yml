name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # ===== 第一层闸门：零成本 =====
    # 只有「版本号文件」本身在本次 push 里被改动，工作流才会被触发。
    # 于是绝大多数提交（文档、tools/ 脚本、原站更新履歴存档…）**连 run 记录都不会产生**，
    # 不占 runner、不占 Actions 分钟、不占 Pages 构建额度。
    #
    # 版本号唯一来源 = site/.vitepress/theme/components/SiteAccessSwitch.vue 的 SITE_VERSION
    #   （项目规矩：升版本号必须同步维护 theme/changelog.json，二者天然一致）
    #
    # ⚠️ 若将来版本号换了地方住，这里要同步改路径，否则闸门会失效。
    paths:
      - 'site/.vitepress/theme/components/SiteAccessSwitch.vue'
  # 手工触发 = 强制部署（无视版本是否变化），唯一可靠的应急通道。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ===== 第二层闸门：版本号真变了才继续 =====
  # 第一层（paths 过滤）只保证「版本号文件被碰过」；这里再比一次**数字本身**，
  # 挡住「只改了版本号附近的注释 / 格式，没升版本号」这种情况。
  # 这一步要起一个极小的 runner（只有 checkout + 一个 shell 步骤，约 10~20 秒），
  # 因为 GitHub 的 if 条件读不到仓库文件内容，想彻底零 runner 只能靠上面的 paths 过滤。
  #
  # 判定规则：
  #   · 比较基准 = 本次 push 之前的提交（github.event.before），因此一次 push 里有多个提交、
  #     版本号在中途递增也能正确识别（不用 HEAD~1）
  #   · 放行（deploy=true）：版本号变化 / 手工触发 / commit message 含 [deploy] /
  #     无法判定（强推、基准提交取不到）—— 一律「宁可多部署一次」
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare SITE_VERSION
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail
          VFILE="site/.vitepress/theme/components/SiteAccessSwitch.vue"
          read_version() { grep -m1 -oE "SITE_VERSION[[:space:]]*=[[:space:]]*'[^']+'" | sed -E "s/.*'([^']+)'/\1/"; }
          decide() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::$2"
          }

          new=$(read_version < "$VFILE")
          echo "version=${new:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            decide true "手工触发 → 强制部署（v${new:-unknown}）"
            exit 0
          fi
          case "$MSG" in
            # 应急：既碰了版本号文件、commit message 又带 [deploy] 时强制部署
            *"[deploy]"*) decide true "commit message 含 [deploy] → 强制部署（v${new:-unknown}）"; exit 0 ;;
          esac
          if [ -z "$new" ]; then
            decide true "读不到 SITE_VERSION（$VFILE）→ 保守放行"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            decide true "首次推送 / 新分支，无比较基准 → 放行（v$new）"
            exit 0
          fi
          if ! git fetch --depth=1 --quiet origin "$BEFORE" 2>/dev/null; then
            decide true "取不到基准提交 $BEFORE → 保守放行（v$new）"
            exit 0
          fi

          old=$(git show "$BEFORE:$VFILE" 2>/dev/null | read_version)
          if [ "$old" != "$new" ]; then
            decide true "版本变更 ${old:-（无）} → $new，执行部署"
          else
            decide false "版本未变（v$new），本次不构建不部署。确需重新发布：在 Actions 页手动 Run workflow（workflow_dispatch 会无视版本强制部署）。"
          fi

  build:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      # 不在 checkout 阶段拉 LFS，改为“缓存 + 增量 pull”节省 LFS 带宽配额：
      # 命中缓存时 git lfs pull 只下载新增/变更的对象（通常 0～几 MB）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LFS file list
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull && git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e pipeline

      # 由已入库的 data/raw 快照本地解析出 data/parsed（无需联网）
      - name: Parse snapshots
        run: python -m escah_pipeline.cli parse

      # 生成 VitePress 站点内容（frag / md / public，含图片拷贝）
      - name: Generate site content
        run: python -m escah_pipeline.cli sync-site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: site
        run: npm install

      # SEO：canonical / sitemap / robots.txt 的主站地址由 seo.ts 依 BASE 推导（self-canonical）。
      # 若要在 Search Console / 百度站长平台收敛到单一主站，配 repository variable
      # SEO_ORIGIN（如 https://escah.pages.dev）即可，两处构建都会指向它。
      - name: Build site
        working-directory: site
        env:
          SEO_ORIGIN: ${{ vars.SEO_ORIGIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
        run: node build.mjs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

      # ===== Cloudflare Pages（可选）=====
      # 需在仓库 Settings → Secrets and variables → Actions 配置：
      #   CLOUDFLARE_API_TOKEN（权限：Cloudflare Pages:Edit）
      #   CLOUDFLARE_ACCOUNT_ID
      # 注意：GitHub Actions 的 if 条件不允许引用 secrets 上下文，故无法用
      # if 判断 secret 是否存在；改为无条件执行 + continue-on-error:true。
      # 配了 secret → 正常部署到 CF；没配/失败 → 步骤标黄但不影响 GH Pages 主部署。
      # CF 构建环境不支持 Git LFS（图片会变指针文件），因此不在 CF 侧构建，
      # 而是在此处用 BASE=/ 重建一份根路径版 dist 后直传 CF。
      #
      # 必须先以 ESCAH_BASE=/ 重跑一次 sync-site：正文片段里的站内绝对链接
      # （/zh/xxx.html）在生成期就带上了 base 前缀，若沿用 /escah/ 那一版，CF
      # （根路径部署）站内所有正文链接都会 404 —— 对爬虫是成片的死链。
      - name: Regenerate content for Cloudflare (root base)
        continue-on-error: true
        env:
          ESCAH_BASE: /
        run: python -m escah_pipeline.cli sync-site

      - name: Rebuild for Cloudflare (BASE=/)
        continue-on-error: true
        working-directory: site
        env:
          BASE: /
          SEO_ORIGIN: ${{ vars.SEO_ORIGIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
        run: |
          rm -rf .vitepress/dist .vitepress/cache
          node build.mjs build

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 项目已存在则跳过创建（避免 “already exists” 报错刷屏）；不存在才创建。
          # 注：因 API 已成功鉴权并返回 “already exists”，说明 CLOUDFLARE secret 已配好。
          if npx wrangler pages project list 2>/dev/null | grep -qw escah; then
            echo "Cloudflare Pages 项目 'escah' 已存在，跳过创建。"
          else
            echo "创建 Cloudflare Pages 项目 'escah'..."
            npx wrangler pages project create escah --production-branch=main || true
          fi

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .vitepress/dist --project-name=escah --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
