name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 不在 checkout 阶段拉 LFS，改为“缓存 + 增量 pull”节省 LFS 带宽配额：
      # 命中缓存时 git lfs pull 只下载新增/变更的对象（通常 0～几 MB）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LFS file list
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull && git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e pipeline

      # 由已入库的 data/raw 快照本地解析出 data/parsed（无需联网）
      - name: Parse snapshots
        run: python -m escah_pipeline.cli parse

      # 生成 VitePress 站点内容（frag / md / public，含图片拷贝）
      - name: Generate site content
        run: python -m escah_pipeline.cli sync-site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: site
        run: npm install

      - name: Build site
        working-directory: site
        run: node build.mjs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

      # ===== Cloudflare Pages（可选）=====
      # 需在仓库 Settings → Secrets and variables → Actions 配置：
      #   CLOUDFLARE_API_TOKEN（权限：Cloudflare Pages:Edit）
      #   CLOUDFLARE_ACCOUNT_ID
      # 未配置这两个 secret 时以下步骤自动跳过，不影响 GH Pages 部署。
      # CF 构建环境不支持 Git LFS（图片会变指针文件），因此不在 CF 侧构建，
      # 而是在此处用 BASE=/ 重建一份根路径版 dist 后直传 CF。
      - name: Rebuild for Cloudflare (BASE=/)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        working-directory: site
        env:
          BASE: /
        run: |
          rm -rf .vitepress/dist .vitepress/cache
          node build.mjs build

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .vitepress/dist --project-name=escah --branch=main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
