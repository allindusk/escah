name: Weekly Upstream Changelog

# 每周（UTC 周一 15:00 = 日本周二 00:00）读原站「更新履歴ページ」一次请求 →
# 解析出「最新 100 条（日期 + 页面名）」→ 与仓库里的 registry/manifest 对照 →
# 把本周的**新增页**与**已更新页**存档进 data/upstream/ 并提交入库。
#
# 本地要更新时：`git pull` 拿到存档 → 看 latest.json / weekly/<周>.md 就知道
# 这周原站动了哪些页，直接定向处理，不必再全量爬取比对（675 次请求）。
#
# ⚠️ 2026-10-19 用户决定：**CI 不再做自动同步 / 解析 / 建站 / 机翻**。
#   原先的 discover → fetch → update → sync-recent → sync-stale → parse → assets
#   → i18n build/glossary-fill/char-fill → sync-site → extract → commit 整条流水线
#   全部移除（包括每一步为何存在、踩过什么坑的完整说明，都保留在 git 历史里可查），
#   以后镜像与发布**全部在本地完成后推送**。本工作流只保留"每周存档原站更新履歴"这一件事。
#
#   产物（全部入库）：
#     data/upstream/latest.json          最新一份（本地更新时读这个）
#     data/upstream/weekly/<ISO周>.json  按周存档，留历史
#     data/upstream/weekly/<ISO周>.md    人类可读摘要
#     data/upstream/history.ndjson       累积流水（可查"某页哪周动过"）
#
#   条目 status：new=原站有、本地未登记（需 discover+抓取）／update=原站比本地快照新
#                ／unchanged=本地已覆盖／excluded=刻意不镜像（评论、沙盒等）
#                ／frozen=no_auto_update（如反爬的公式ヘルプ，站点照常渲染）
on:
  # ⏸️ 定时触发**已暂时关闭**（2026-10-19 用户决定）：
  #   先手动跑一次，确认 CI 能否穿过原站新加的 Cloudflare 无感 JS 挑战、
  #   正常生成存档；确认可用后再打开定时。
  #   打开方式：删掉下面三行行首的 `# `。
  # schedule:
  #   - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e pipeline

      # 常规通道：纯 HTTP（1 次请求，内部已含 3 次退避重试）。
      # 解析到 0 条时命令会**主动失败**（不落盘），以免用空存档覆盖上周的数据
      # （那会让本地误以为"原站啥也没动"，比没存档更糟）。
      # WIKIRU_COOKIE：可选 secret，填浏览器里的 `cf_clearance=...` 直接通过验证。
      #
      # ⚠️ 2026-10-19：**不再默认下载 playwright chromium**（120 MiB + 每次装依赖，
      #   绝大多数周次用不上）。改为「HTTP 失败才装」，见下面两步。
      - name: Archive upstream update history (HTTP)
        id: archive
        env:
          WIKIRU_COOKIE: ${{ secrets.WIKIRU_COOKIE }}
        run: python -m escah_pipeline.cli changelog fetch
        continue-on-error: true

      # 兜底通道：原站 2026-10-19 起加了 Cloudflare 无感 JS 挑战（「One moment, please...」
      # + 5 秒后 JS reload），**不执行 JS 的客户端拿不到正文**。只有常规 HTTP 通道
      # 失败时，才装 chromium 并用真实浏览器重试（`fetch --browser`）。
      - name: Install Playwright chromium (fallback only)
        if: steps.archive.outcome == 'failure'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Archive upstream update history (browser fallback)
        id: archive_browser
        if: steps.archive.outcome == 'failure'
        env:
          WIKIRU_COOKIE: ${{ secrets.WIKIRU_COOKIE }}
        run: python -m escah_pipeline.cli changelog fetch --browser

      # artifact 只是**临时下载件**（方便不 clone 也能看本周结果），90 天后自动过期。
      # 真正的存档是下一步提交进 data/upstream/ 的文件，跟 git 历史一起长期保留 ——
      # 所以这里的保留期到不到期都不影响「历史更新记录」。
      - name: Upload latest archive (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-changelog
          path: data/upstream/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit and push if changed
        run: |
          git config user.name "escah-bot"
          git config user.email "escah-bot@users.noreply.github.com"
          git add data/upstream
          if git diff --cached --quiet; then
            echo "本周存档无变化，跳过提交。"
          else
            git commit -m "chore(changelog): 原站更新履歴存档 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 抓取失败（等待页 / Cloudflare 海外验证 / 结构变化）不要让工作流显示为成功：
      # 存档是"本地决定更新哪些页"的唯一依据，静默失败会让用户以为原站没更新。
      # 常规 HTTP 失败但浏览器兜底成功 → 视为成功，不报错。
      - name: Fail if archive step failed
        if: steps.archive.outcome == 'failure' && steps.archive_browser.outcome != 'success'
        run: |
          echo "::error::changelog fetch 失败（常规 HTTP 与浏览器兜底都未拿到正文，原站可能返回反爬等待页或结构变化），未生成新存档"
          exit 1
