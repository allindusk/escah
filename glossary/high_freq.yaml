# ============================================================================
# 全站高频游戏术语（日 → 中），render-time 子串最高优先级覆盖
# ----------------------------------------------------------------------------
# 来源：tools/_todo_translate/ 高频词精译回流（tools/translate_glossary.py build）
# 应用：pipeline/escah_pipeline/i18n.py 双层覆盖（仅 zh 站；ja 站不受影响）：
#       - 含假名词条 → 子串替换（假名必为日语，安全；覆盖句内残留）
#       - 纯汉字词条 → 整词精确匹配（防污染中文，不子串误改）
# 维护：重跑 translate_glossary.py build 即可刷新（从 paired.txt 重建）。
# ============================================================================
