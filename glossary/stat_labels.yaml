  "宝箱数と蝶鉱石シートを追加": 新增「宝箱数与蝶矿石」工作表
  "宝箱から得られる蝶鉱石の項目に宝箱数と蝶鉱石を追加": 在"宝箱可得的蝶矿石"项目中增加宝箱数与蝶矿石
  "装備アイテムのチェックボックスが参照先シートを参照していた不具合を修正": 修正"装备道具的复选框引用了参照目标工作表"的故障
  "注意書きを追加": 新增注意事项
  "1000箱開封結果のグラフに手動開封の結果が表示されていなかった問題を修正": 修正"1000 箱开箱结果图表中未显示手动开箱结果"的问题
  "1000箱開封結果のグラフのデータラベルを非表示に設定 （見づらかった為）": 把 1000 箱开箱结果图表的数据标签设为不显示（因为过于杂乱）
  "シートを追加した場合、グラフを修正する記載を追加。 シートを追加した場合、目次に記載する旨の記載を追加": 补充说明"新增工作表时要修正图表"与"新增工作表时要在目录中登记"
  "視認性向上のための変更": 为提升辨识度所做的更改
  "集計№5の時間が未計測だった為、平均値を代入": 汇总第 5 号的时长未测量，故代入平均值
  "補足欄に蝶鉱石に関する注意書きを追加": 在备注栏新增关于蝶矿石的注意事项
  "前提条件シートでリセットストラップの使用先を選択した場合に、特定の場合にエラーになる不具合を修正": 修正"在前提条件工作表中选择重置背带的使用对象时，特定情况下会报错"的故障
  "5.5thイベントのクエストを表に追加": 在表中新增 5.5 周年活动的关卡
  "イベントクエストを考慮していなかった為、時短戦闘をすると茶ハニーが出現するように計算していたのを修正。": 因未考虑活动关卡，原先的计算会在缩短时间战斗中出现茶蜂蜜，已修正。
