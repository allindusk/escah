  ・以下、考慮項目(計算に使用): ・以下为考虑项（用于计算）
  "※VIPランク5以上の特典の＜ベース化マス加算＞は未考慮です": ※未考虑 VIP 等级 5 以上的特权＜基础化格子加成＞
  そのため、VIPランク4以下の方は獲得報酬は少なくなります: 因此 VIP 等级 4 以下的人获得报酬会变少
