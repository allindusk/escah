# 统计数据页（data/statdata → 站点「其他 / 数据统计」）的**结构性标签**词表。
#
# 只放"表头 / 栏目 / 汇总词"这类**结构性标签**；道具名与专名不在这里 ——
#   · 道具名/角色名等**复用站内既有词表**（names / high_freq / terms / phrases / phrases_manual）✓，
#     由 statpages.load_labels() 合并后按精确匹配命中 ✓；
#   · 站内词表也没有的（多为作者自造的示例道具名），**保留日文原文** ✓（绝不瞎编 ✗）。
#
# 数字/百分号/日期由渲染器直接原样保留，不查本表 ✓。
