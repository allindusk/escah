  # ---- 前提条件里的操作说明（整句人工翻译 ✓，不逐词拼接 ✗）----
  "・水色の背景のセルだけ入力します(他のセルは変更しない)": ・只填写浅蓝色背景的单元格（其他单元格请勿修改）
