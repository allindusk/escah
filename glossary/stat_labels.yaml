  記載しているデータよりも石を割る際の効率は悪くなります: 与所记载的数据相比，碎石时的效率会更差
  ※獲得物については検証シートを参照: ※关于获得物请参照验证工作表
  ３．２から１を引いたものを逞しきドロップの価値とする: 将 3.2 减去 1 后的值作为强力掉落的价值
  誤字や可読性の向上のための軽微な修正: 为修正错字、提升可读性所做的轻微修改

