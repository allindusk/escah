# 5) 行内独立术语（全站 render_locale 最高优先级覆盖，整词精确匹配）。
#    角色数据中的备注行用 ⭐︎（U+2B55），wiki 原文为 *，两者都收录以防漏。
inline_terms:
  "基本ステータス(⭐︎1時点)※⭐︎1つ増加毎に+50%、⭐︎5で⭐︎1時点の3倍": "基础属性(★1状态)※星级每提升1颗，属性增加50%；★5时属性为★1状态的3倍"
  "基本ステータス(*1時点)※*1つ増加毎に+50%、*5で*1時点の3倍": "基础属性(★1状态)※星级每提升1颗，属性增加50%；★5时属性为★1状态的3倍"
  "※⭐︎1つ増加毎に+50%、⭐︎5で⭐︎1時点の3倍": "※星级每提升1颗，属性增加50%；★5时属性为★1状态的3倍"
  "※*1つ増加毎に+50%、*5で*1時点の3倍": "※星级每提升1颗，属性增加50%；★5时属性为★1状态的3倍"
