# ============================================================================
# 站点词汇表（日 → 中）  ESCH 双语镜像站
# ----------------------------------------------------------------------------
# 用途：仅翻译「站点功能性文案」—— 页面标题、侧栏链接文字、角色悬浮窗分段标题。
#      这些不属于正文，用户不手工翻译，由 AI 维护本表。
# 作用域：仅作用于 zh 站点；ja 站点保持日文原文。
#       角色名（369 个）按约定保留日文，不在此表内（查不到即保留原日文）。
# 读取：pipeline/escah_pipeline/sitegen.py 在 sync-site 时加载本文件，
#       - page_titles  → 页面 .md 标题（浏览器标签 + H1）与侧栏链接文字
#       - char_sections → 角色悬浮窗分段标题（经 .gen-data/site-terms.json 下发前端）
# 维护：新增/更名页面时，在此追加「日文原名: 中文」即可，无需改代码。
# ============================================================================

