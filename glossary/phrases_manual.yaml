  ? A.通常攻撃は、まず攻撃側の命中力を元に命中判定を行います。{br}自軍が防御側の場合のみ、{br}攻撃側の命中力よりも回避力が高ければ、{br}攻撃側の命中力が２５％減少した状態で命中判定が行われます。{br}命中判定が成功すると回避判定は行わず、攻撃は命中します。{br}命中判定で失敗した場合、次に防御側の回避力を元に回避判定を{br}行います。{br}回避判定で失敗した場合、攻撃は命中します。{br}なお、通常攻撃が魔法であれば、{br}固有効果で「攻撃を全て回避」効果がある場合を除き、{br}必ず命中します。{br}必殺技は命中判定が行われず、必ず命中します。
  : A.普通攻击首先以攻击方的命中力为基础进行命中判定。{br}仅当自军为防御方时，{br}若回避力高于攻击方的命中力，{br}则以攻击方命中力减少25%的状态进行命中判定。{br}命中判定成功后不再进行回避判定，攻击命中。{br}命中判定失败时，接着以防御方的回避力为基础进行{br}回避判定。{br}回避判定失败时，攻击命中。{br}另外，若普通攻击为魔法，{br}除固有效果中有「回避全部攻击」效果的情况外，{br}必定命中。{br}必杀技不进行命中判定，必定命中。
