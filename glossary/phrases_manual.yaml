  : 小茉莉将射入红宝石的大量接现力转移到人偶上而诞生的幻魔。登场于活动『圣夜的桃色时间』。{br}会（以全语音）连发本家难以想象的淫猥言行。实力无意间比本家更强，还会拿市民当盾牌，头脑也很灵活。{br}进入性之6小时后，连传说战士都难以招架地变强，还不知为何觉醒了让对方赤身裸体的能力。{br}除了能让黄玉、蓝宝石、阿梅兹昏倒的惊人舌技外，不知为何阿梅兹的魔眼对它无效。而且还能变成阿斯特莱兹形态。这家伙真是离谱{br}顺带一提，红宝石的CV苍乃结女士似乎很喜欢它，在官方广播里时不时会提到。
  ? ルビーは人助けの意思があってもフーマンと戦う「手段」を知らなかった。{br} サファイアは閃忍の使命感と技術はあっても「素質」が無かった。{br} トパーズはヒーローになりたいという憧れがあっても魔力の「制御」が出来なかった。{br} アメイズは魔女としての力も戦う意思もあったが、幻魔の存在が不透明だったが故にその力の「行使」が出来なかった。
  : 红宝石即使有助人的意志，也不知道与原忍战斗的「手段」。{br} 蓝宝石虽有闪忍的使命感与技术，却没有「资质」。{br} 黄玉虽有想成为英雄的憧憬，却无法「控制」魔力。{br} 阿梅兹既有作为魔女的力量也有战斗意志，但因幻魔的存在不透明而无法「行使」那份力量。
