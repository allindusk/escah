  ? 返信ありがとうございます。 {br}無言で編集合戦になってしまうのは不毛だと思ったのが第一だったので意思疎通が計れて良かったです。 {br} {br}まず当初の編集意図として単純に {br}・「『かばう』を無視する必殺技を使用する」 {br}・「ダメージ倍率の高い必殺技で押しきる」 {br}という異なった2種類の対応方法が同一の節に存在する不整合を回避するため、全体を整理する段階でそれぞれを個別の節として記述しました。 {br}ですが、同時に上のコメントでも触れられている、効率良く楽に倒す手段を明示すべきだという考え方にも同意できます。 {br}自分も当初は、その考えに基づき「『かばう』を無視する必殺技を使用する」という節の真下に並立する形で「ダメージ倍率の高い必殺技で押しきる」の節も設置して、両方の項目の視認性を十分に確保したつもりでした。 {br}両者は内容的にも近似しており、この2つの項目はできるだけ近い場所に配置するほうが好ましいと考えました。 {br} {br}ただ、その後、別のかたが編集された際に「ダメージ倍率の高い必殺技で押しきる」のほうを下側に移動させる形で編集されたので、自分の方が元に戻して編集合戦になるのも不毛かと思いそのままにしていました。 {br}その後「『かばう』を無視する必殺技を使用する」という項目の内側に混ぜる形で「ダメージ倍率の高い必殺技で押しきる」が再び戻ったので、上述のように異なる手段が同一の節の中に存在する不整合が、情報の記載として好ましくない為、直前に編集されたかたに倣う形で編集を戻したというのが経緯です。 {br} {br}ですが、効率良く攻略情報を提示すべきという点と、情報は不整合無く提示すべきという、双方の要件を矛盾無く満たす形での情報の記載も可能だと思います。 {br}当初のように「ダメージ倍率の高い必殺技で押しきる」の真下に並立する形で「『かばう』を無視する必殺技を使用する」を記載する形では、どうでしょうか？ {br}これなら攻略の効率性や視認性の確保と同時に記載の不整合も起きず、また自分が本来編集した形でもあるので特に問題は無く感じます。 {br} {br}とりあえず現状そのような形で再編集してみたのですが、もし不都合あるようでしたら再度コメントいただければ幸いです。
  : 感谢回复。 {br}我首先觉得默默变成编辑战是没有意义的，所以能沟通意思很好。 {br} {br}首先我当初的编辑意图单纯是 {br}・「使用无视『掩护』的必杀技」 {br}・「用伤害倍率高的必杀技强推」 {br}为了避免这两种不同应对方法存在于同一节的矛盾，在整理整体时把各自作为个别节记述。 {br}但同时我也同意上面评论提到的、应明示高效轻松打倒手段的想法。 {br}我自己当初也基于那个想法，在「使用无视『掩护』的必杀技」这一节正下方并列设置了「用伤害倍率高的必杀技强推」这一节，本以为充分确保了两者的可视性。 {br}两者内容上也相近，我认为这两个项目尽量放在近处更好。 {br} {br}只是，之后别人编辑时把「用伤害倍率高的必杀技强推」移到了下面，我觉得自己再改回去导致编辑战也没意义，所以就这样放着。 {br}之后「用伤害倍率高的必杀技强推」又以混进「使用无视『掩护』的必杀技」项目内部的形式回来了，如上所述不同手段存在于同一节中的矛盾作为信息记载并不好，所以我按刚编辑的人的做法把编辑改回去了，这是经过。 {br} {br}不过我认为也能以同时满足「应提示高效攻略信息」与「信息应无矛盾地提示」双方要求的形式来记载信息。 {br}像当初那样，在「用伤害倍率高的必杀技强推」正下方并列记载「使用无视『掩护』的必杀技」，这样如何？ {br}这样既能确保攻略的高效性与可视性，又不会发生记载的矛盾，而且也是我本来编辑的形式，所以我觉得特别没问题。 {br} {br}总之我先以那样的形式重新编辑了，若有不便请再评论告知。
