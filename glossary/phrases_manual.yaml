  ? 要約すると、必殺技連発モードで倒すなら順序は問われず、1回の必殺技で同時に倒す必要もない。{br} 全員の必殺技を撃ち切るまでにどちらも倒れているならそれでokである。{br}{br} …多分。{br} サンプルはこれからも集める。{br}{br} サンプル追加：{br} サイエンフラストの「自身が倒れる時、出撃中の全エネミーに即死ダメージ」の効果は「必殺発動待機（仮称）」に割り込めない。{br} サイエンフラストが倒れても、必殺ゲージが100%溜まっていて必殺技発動指示が出ている味方がいればそちらの方が優先される。{br} 必殺技が終わるまで戦闘が終わらないという事なので、これにはメリットは全くないが。{br}{br} ウェーブフラストやムービーフラスト等が持つ「強者のオーラ」は「必殺発動待機（仮称）」に割り込めない。{br} 必殺技のダメージで体力が75%や50%や25%を下回っても、必殺ゲージが100%溜まっていて必殺技発動指示が出ている味方がいればそちらの方が優先される。{br} キクリやコテツ同様、一度に致死分の必殺技ダメージを与えられるならば強者のオーラを気にする事なく仕留める事が出来るのでこちらは明確なメリットになり得る。{br} ただし雑魚がかばってくる事についてはどうしようもない為、運ゲーを甘受しないのであれば何らかの対策は必要。{br}{br} サンプル追加２：{br} 「撤退」や「出撃準備完了」及び「出撃完了」は「必殺発動待機（面倒なので以降仮称は外す）」に割り込める。{br} つまり「Aが必殺技発動」→「Bが必殺技発動」の流れに割り込んで「Aが必殺技発動」→「Aが撤退」→「Cが出撃準備完了」→「Bが必殺技発動」となる。{br} 当然と言えば当然かもしれない。{br} 「出撃準備完了」は初期出撃人数が4人のステージでも出撃速度0秒の5人目が開幕の固有効果の対象になるくらい優先度が高い。{br}{br} 「サポーター」は「必殺発動待機」に割り込めない？ {br} 「Aの必殺技演出中」に連打しても次の「Bの必殺技発動」が優先される。{br} あるいは連打の気合が足りないのかもしれない。もしくはサポーターのレベルに依存する可能性も否定は出来ない。{br}{br} 「通常攻撃」は「必殺発動待機」に割り込める。{br} 前述の通り、"厳密には必殺技を1回発動させる度に僅かに時間は進む（通常攻撃周期の☆が動く）"ので、偶々Cの通常攻撃の☆が回り切る直前にAが必殺技を撃ち、{br} 次にBが必殺技を撃つまでに☆が進み一周した場合、「Aが必殺技発動」→「Cが通常攻撃」→「Bが必殺技発動」という流れになる。{br} してみるとこれ敵の通常攻撃に割り込まれて倒される可能性あるのか？{br}{br} 「敵の残数のカウント」は「必殺発動待機」に割り込める。{br} Bの必殺技発動よりもAに必殺技で倒された敵が消えるのが先で、敵の数のカウントが減るのも先になる。{br} よってAが必殺技で倒した敵にBが更に必殺技を撃つ事はない。当たり前と言えばあまりに当たり前。
  : 总结来说，若以必杀技连发模式打倒，顺序无所谓，也不需要一次必杀技同时打倒。{br} 只要在全员必杀技打完之前两者都倒下就行。{br}{br} …大概。{br} 样本今后也会继续收集。{br}{br} 样本追加：{br} 赛恩弗拉斯特的「自身倒下时，对出战中全敌造成即死伤害」效果无法插进「必杀发动待机（暂称）」。{br} 即使赛恩弗拉斯特倒下，若有必杀计量条100%积满并已下达必杀技发动指示的队友，则那边优先。{br} 也就是说必杀技结束前战斗不会结束，这完全没有优点。{br}{br} 波弗拉斯特或视频弗拉斯特等持有的「强者光环」无法插进「必杀发动待机（暂称）」。{br} 即使必杀技伤害让体力低于75%、50%、25%，若有必杀计量条100%积满并已下达必杀技发动指示的队友，则那边优先。{br} 与菊理、小手一样，若能一次给予致死量的必杀技伤害，就能不在意强者光环地击毙，所以这边能成为明确的优点。{br} 不过对杂兵来掩护这点没办法，所以若不想接受运气游戏，就需要某种对策。{br}{br} 样本追加２：{br} 「撤退」与「出战准备完成」及「出战完成」能插进「必杀发动待机（太麻烦所以以下去掉暂称）」。{br} 也就是能插进「A发动必杀技」→「B发动必杀技」的流程变成「A发动必杀技」→「A撤退」→「C出战准备完成」→「B发动必杀技」。{br} 说起来或许理所当然。{br} 「出战准备完成」优先级高到即使初期出战人数4人的关卡，出战速度0秒的第5人也会成为开幕固有效果的对象。{br}{br} 「支援者」无法插进「必杀发动待机」？ {br} 在「A的必杀技演出中」连打也会优先下一个「B的必杀技发动」。{br} 或许是连打的气势不够。或者也不能否定依存于支援者等级的可能性。{br}{br} 「普通攻击」能插进「必杀发动待机」。{br} 如前述，「严格说每次发动1次必杀技时间会略微前进（普通攻击周期的☆会动）」，所以偶尔在C的普通攻击☆即将转完前A打出必杀技，{br} 在下一个B打出必杀技之前☆前进转了一圈时，流程会变成「A发动必杀技」→「C普通攻击」→「B发动必杀技」。{br} 这么一想这有可能被敌人的普通攻击插进来打倒吗？{br}{br} 「敌人残数的计数」能插进「必杀发动待机」。{br} 比起B的必杀技发动，被A的必杀技打倒的敌人先消失，敌人数量先减少。{br} 因此B不会对被A的必杀技打倒的敌人再打必杀技。说起来太理所当然了。
