  ? 行動速度と必殺充填はRやSR全体で見れば平均くらいだが、キャラクター交換所の中でも強いキャラと比べると少し見劣りする。{br} カクセイの木SRは同Rより入手量が少ないため、覚醒で鍛えるのも結構大変。{br} 例えば行動速度3.1sec・必殺充填15%・必殺技と固有効果の覚醒という最大限鍛える目標を掲げた場合、イベントに30回参加する必要があり丸一年以上かかる。{br} ナギが推しでなるべく早く強くしたいなら、通常のカクセイの木の投入や、好感度による覚醒ポイント獲得の活用も検討した方がいいかもしれない。
  : 行动速度与必杀充能在R或SR整体来看算平均，但与角色交换所中较强的角色相比稍显逊色。{br} 觉醒之木SR比同R的获取量少，所以靠觉醒锻炼也相当辛苦。{br} 例如提出行动速度3.1sec・必杀充填15%・必杀技与固有效果觉醒这个最大限度锻炼的目标时，需要参加活动30次，花费一年以上。{br} 若娜姬是推想尽早变强，或许该讨论投入通常的觉醒之木，或活用靠好感度获得觉醒点数。
