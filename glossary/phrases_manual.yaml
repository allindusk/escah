  ? ただし超昂大戦は、限界突破でステータスが極めて大きく上昇する割に大量のリソースが必要でおいそれと限界突破できない。{br} ☆3まで限界突破してようやく、交換所で手に入るRキャラの☆5よりは活躍できる程度にしかならない。{br} SSRらしい活躍をさせたいなら☆5まで限界突破させて必殺技を覚醒させたいところだが、コラボ期間の2週間そこらでは☆5まで限界突破するのはかなり難しい。{br} 地道に絵馬系アイテムを集めて育てていこう。昂る蕾でも限界突破ポイントを貯められるが、これは対魔忍RPGにおける消えないマイレージあるいは万能メモリーのようなもので限界突破につかうのはかなりもったいない。キャラ交換用に溜めることを推奨する。{br} 本作に期間限定で消滅するリソースは無いので、限定キャラでも初回入手さえできていればあとはリソースをコツコツ集めて育てられる点は良心的。
  : 不过超昂大战中，界限突破虽会极大提升状态却需要大量资源，无法轻易界限突破。{br} 界限突破到☆3才终于达到比交换所可得的R角色☆5更能活跃的程度。{br} 想让她有SSR般的活跃，就想界限突破到☆5并觉醒必杀技，但在联动期间的2周左右要界限突破到☆5相当困难。{br} 就踏实收集绘马系道具来培养吧。用昂扬花苞也能积攒界限突破点数，但这相当于对魔忍RPG中不会消失的里程或万能记忆，用来界限突破相当浪费。推荐攒着用于角色交换。{br} 本作没有会随期间限定消灭的资源，所以即便是限定角色只要初次获取了，之后就能慢慢收集资源培养，这点很良心。
