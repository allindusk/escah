  ? ・ノノノ（バッファー＆デバッファー）{br} 攻撃バフか防御デバフがないとまともにダメージが通らない。攻撃デバフがないと反撃が痛過ぎる。命中を補正しないと攻撃が当て難い。{br} これらの問題を1枠で解決出来るノノノもやはり適している。後衛で反撃ダメージを考慮しなくて良い為に装備の自由度が高いのもメリット。{br} 斗羽と比較した場合の利点は限界突破や覚醒のコストが安い事、命中バフや攻撃バフにより与ダメージで斗羽を上回る事、必殺ゲージ供与により開幕の展開を有利に進められる事。
  : ・野野野（增益手＆减益手）{br} 没有攻击增益或防御减益就无法正经造成伤害。没有攻击减益反击就太痛。不修正命中就很难打中。{br} 能用一个栏位解决这些问题的野野野果然也适合。在后卫不用考虑反击伤害所以装备自由度高也是优点。{br} 与斗羽比较时的优点是界限突破与觉醒成本便宜、靠命中增益与攻击增益在给予伤害上超过斗羽、靠必杀计量条供与能有利推进开幕展开。
  ? ・バレンタインリコリス型{br} 累積バフ持ちで連撃時にボーナス効果のあるバレンタインリコリスに聖剣コスモスを持たせた編成。{br} 連撃型アタッカーのバビロニア・ニルと並べて必殺割込みによる手動硬直消しをまとめて行うと強力。{br} リコリスとニルが1FEVERで20回以上攻撃でき、最大育成ならFEVER当たりスコアが3000万を超える。
  : ・情人节莉可莉丝型{br} 让持有累积增益、连击时有奖励效果的情人节莉可莉丝装备圣剑科斯莫斯的编成。{br} 与连击型攻击手巴比伦尼亚·尼尔并列，通过必杀插入统一进行手动硬直消除会很强大。{br} 莉可莉丝与尼尔在1次FEVER中可攻击20次以上，若培养到最大则每次FEVER分数可超过3000万。
