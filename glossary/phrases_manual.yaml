  ? 固有効果は自身を除いた確率の全体与ダメアップ。閃忍の場合は効果が大きく上昇する。{br} 覚醒後固有効果でバフを維持できる確率は、行動速度1.5secで数字に表れない攻撃モーションと連撃40％を計算に入れて7～8割ほど。{br} レイドの完凸納豆装備で約71秒戦闘できるとすると、FEVER無しの条件でも適用期待時間は約57秒、FEVER2回で62秒ほどになる。{br} 速度アップによって攻撃頻度を上げるほど効果を維持できる確率は上がる。
  : 固有效果是除自身外概率性我方全体给予伤害提升。若是闪忍则效果大幅上升。{br} 觉醒后靠固有效果维持增益的概率，以行动速度1.5sec、数字上看不出的攻击动作与连击40％计算在内约为7～8成。{br} 若突袭的完凸纳豆装备能战斗约71秒，则即便无FEVER条件适用期望时间约57秒，FEVER2次约62秒。{br} 靠速度提升提高攻击频率越多，维持效果的概率越高。
