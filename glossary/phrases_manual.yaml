  〇耐性についての仮説：{br} どうにも味方の攻撃力が一定の値を超える、あるいは敵の防御力が一定値を下回ると減算（推測）がほぼ無くなるかのように見える。{br} また、それらは複合でも起こり得る。: 〇关于耐性的假说：{br} 看起来无论如何，当队友攻击力超过一定值，或敌人防御力低于一定值时，减算（推测）就几乎消失。{br} 另外，这些也可能复合发生。
