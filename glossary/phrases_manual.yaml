  : 科巴里将射入红宝石体内的大量接现力转移到人偶上后诞生的幻魔。登场于活动『圣夜的桃色时间』。{br} 接连说出本家难以想象的猥亵言行（全语音）。不仅莫名比本家更强，还会拿市民当盾，头脑也很灵活。{br} 进入性的6小时后，强到连传说战士都束手无策，还不知为何觉醒了让对手全裸的能力。{br} 除了让黄玉・蓝宝石・阿梅兹昏倒的惊人舌技外，不知为何阿梅兹的魔眼也无效。而且还能变成阿斯特莱兹形态。这家伙真是乱七八糟{br} 另外，红宝石的CV苍乃结在官方广播中时常提及它，看来相当喜欢。
