  ? 「かつて天壌無窮を掲げ、ノロイの力によって人の世を終わらせようとした異形の集団。上弦衆と激しい戦いを繰り広げた末に、歴史の影に姿を消した。」{br} 『超昂閃忍ハルカ』に登場した敵組織。上弦衆に敗れイタチの肉体に魂を移したノロイと骸居炎斎が立ち上げた、「時渡りの鐘」を利用して時を超えて現代へ姿を現す。{br} 対ノロイを主目的として結成された上弦衆と古くから対立しており、ノロイ党が未来へ転移した後はその再来を見越して活動を続けていた。{br} 組織は幹部である四道封者の他、戦闘員であるゲニンやノロイの力で変異した人間である怪忍で構成されている。怪忍には現地で力を与えられた者も居る。{br} 閃忍ハルカと閃忍スバルは戦国時代の頃からノロイ党と戦っており、ノロイ党の時空転移に巻き込まれる形で現代に転移している。{br} 社会体制の破壊が目的としているが、貧困層の暮らしがより厳しい戦国時代の組織という事もあり{br} 「虐げられた事への復讐」「現状の理不尽な世の中を超常の力を以て変革・救済する」といった、一概に悪とは言えない思想の元で動いている人間も所属している。というか四道封者4人の内3人はそういう思想である。{br} 本作『超昂大戦』2部の主だった敵として登場。現代へ転移した後に『ネオノロイ党』に名を改めている…と思われたが、実態としては別物。{br} 超昂大戦での現代へ転移する経緯は『時渡りの鐘』が偶発的に発動し、ノロイと魂で繋がった幹部である四道封者は巻き込まれる形で現代に転移。到着した時間はバラバラでその後の行動もバラバラである。{br} また、四道封者は白侯天を除き原作のメンバーの同一存在だが、性別が逆転している。
  : 「曾高举天壤无穷之旗，企图借诺罗伊之力终结人世间的异形集团。与上弦众展开激战，最终消失在历史阴影中。」{br} 『超昂闪忍遥』中登场的敌方组织。由败于上弦众、将灵魂转移到鼬之肉体的诺罗伊与骸居炎斋创立，利用「时渡之钟」超越时空现身于现代。{br} 与以对诺罗伊为主要目的而结成的上弦众自古对立，诺罗伊党转移到未来后，他们便预见其再临而持续活动。{br} 组织由干部四道封者、战斗员原忍，以及借诺罗伊之力变异的人类怪忍构成。怪忍中也有在当地被赋予力量者。{br} 闪忍遥与闪忍昴自战国时代起便与诺罗伊党战斗，因被卷入诺罗伊党的时空转移而转移到现代。{br} 其目的是破坏社会体制，但因为是贫困层生活更严酷的战国时代的组织，{br} 也有以「对受压迫的复仇」「以超常之力变革・救济现状这不合理之世」这类不能一概称恶的思想活动的人所属。不如说四道封者4人中有3人都是这种思想。{br} 在本作《超昂大战》第2部中作为主要敌人登场。转移到现代后改名为『新诺罗伊党』…本以为如此，但实际上是另一回事。{br} 在超昂大战中转移到现代的经过是『时渡之钟』偶然发动，与诺罗伊以灵魂相连的干部四道封者被卷入其中转移到现代。抵达时间各不相同，之后的行动也各自分散。{br} 此外，四道封者除白侯天外虽是原作成员的同一存在，但性别发生了逆转。
