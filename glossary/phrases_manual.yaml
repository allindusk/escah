  レイドなら反撃ももらわないしね {br}ただ一番ヒーラーが欲しいグナガンだとスリップで結局自分が落ちるかな 撤退時の回復はそう考えると偉い {br}あ、でもマリナの衣装あるから多少カバー出来そう: 若是突袭也不会挨反击呢 {br}只是最想要治疗者的古纳钢会因滑落结果自己倒下吧 撤退时的回复这样想就很了不起 {br}啊，不过因为有玛莉娜的服装所以多少能补上
  ? レイドにおいては2編成目以降で超昂閃忍ナリカやエスカチームなどのジッポ効果使用後のアタッカーがいれば、バフもデバフも引き継いで出撃順によるロスを最小限にしつつこの運用が可能。{br} 固有効果フル発動のエスカルビー・アステライズや、エスカサファイア・ムーンライズやエスカ・オニキス等の固有効果の高倍率バフをエスカアメイズ・ファンタスマで延長したままスタミナ回復で3割長く戦闘する、などが効果的な使い方。
  : 在突袭中，若第2编成以后有超昂闪忍娜莉卡或艾斯卡小队等使用拉链效果后的攻击手，就能同时继承增益与减益，将按出战顺序的损失降到最小并实现这种运用。{br} 有效的用法有：全发动固有效果的艾斯卡红宝石・阿斯特莱兹，或用艾斯卡阿梅兹・法塔斯玛将艾斯卡蓝宝石・月升与艾斯卡・缟玛瑙等固有效果的高倍率增益延长，同时靠体力回复多战斗3成时间，等等。
