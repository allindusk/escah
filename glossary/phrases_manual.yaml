  : 这是眩晕的专家呢。由于有仇恨0和撤退时减益，能撑满50秒留在场上，减益到70秒都有效，所以不装备纳豆也能更容易地做W闪栗。考虑觉醒与装备的最高能力，打击眩晕率达97%，加上场地眩晕抵抗减，事实上127% 必杀技是177%。对抵抗率35～40%的BOSS，即使BREAK后抵抗上升，普通打击也有4成左右亮灯，必杀技则9成亮灯。第三次BREAK确实不可能，但反正过了50秒就撤退所以没问题。因为是场地的抵抗减益，所以理论上也能与玩偶装卡佩拉复合。而且回避命中下降50，太令人高兴了！
