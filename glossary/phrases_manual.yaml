  ? メインストーリー第16章で接現力確保のために人間を石にする目的でアカリ達の学園へ潜入した。{br} 妖術の類で周囲の人物を騙してアカリの隣の席で転校生として振る舞い、よっしーは「ひらっち」と呼ぶほど。{br} 学園全体を蜘蛛の巣で包むと幻魔としての正体を表し、生徒達を次々に石にしていった。{br} その後、学園に突入してきたメイ・アイ・サナギ・カノープスや校内にいたエスカチームらと戦闘になるがハツネが優勢。{br} 解決策として、巣の中でエリーが見つけた「封印された記憶の玉」(記憶自体は読めなかった)を元にカノープスがその時の感情を呼び起こす演奏を流す。{br} 演奏を聞いたハツネは自身を補った記憶が自身の本当の体験とは別物であることを認識することになった。{br} 耐えきれなくなったハツネは自身に憑依していた『魂』を引き剥がしてしまい、再度大幅な弱体化をする。{br} 結果、アカリ達に敗れ去りその身体は音もなく消滅していった。
  : 主线剧情第16章中，为确保接现力而以将人类化为石头为目的潜入了明里等人的学园。{br} 用妖术之类欺骗周围人，在明里旁边作为转校生行动，良吉甚至叫她「平亲」。{br} 将整个学园用蜘蛛网包住后显露幻魔真身，把学生们接连化为石头。{br} 之后与冲入学园的梅、爱、蛹、卡诺普斯及校内的艾斯卡小队等战斗，初音占优。{br} 作为解决策，卡诺普斯根据艾莉在巢中找到的「被封印的记忆之玉」(记忆本身无法读取)演奏唤起当时情感的曲子。{br} 听到演奏的初音认识到，自己补全的记忆与自身真正的经历是两回事。{br} 无法承受的初音将自己身上的『魂』剥离，再次大幅弱化。{br} 结果败给明里等人，其身体无声地消灭了。
