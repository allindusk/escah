  : 除用固有效果使魅惑无效（觉醒后我方全体）的效果外，当体力降到一定比例以下时，会发动攻击提升与特殊的回避效果。{br} 是只在规定体力以下期间适用的效果，因不是增益所以不显示图标。也不会成为增益解除或增益无效的对象。{br} 即使因伤害或回复在特定比例前后往返，也只在满足条件时有效。{br} 攻击提升30％（觉醒50％）当然易懂地强，但回避效果那边也很强力。包含魔法攻击的普通攻击、以及大型BOSS*2的攻击都不会受到伤害。{br} 大型BOSS以外的敌人必杀技是必中，但若用某种方法封住敌人的必杀技，除了体力减少导致的撤退以外，也并非不能一直驻留战斗。{br} 也不会受到反击，觉醒后持续伤害也无效。
