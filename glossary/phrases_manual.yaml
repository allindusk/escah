  ? フレーバーテキストのLP2年（『IV』本編）は彼女にとってこれまた大波乱の年であった。{br} 「謎の浮遊都市に飛ばされたランスとその奴隷・シィルの救出」という建前で、常にランスのそばにいる奴隷の存在を疎んじたリアからシィルの抹殺命令が密かに下されるも、『III/03』で彼女と築いた友情を無下にはできず、シィルにランスの悪逆非道ぶりを説いたうえで別れるよう忠告。{br} しかしシィルは自らの意志で彼の奴隷になっていること、かなみに殺されることで彼に殉じようとする強い意志を見せられ結局断念。今度はリアの意に反してしまったかなみが自決を図った直後にランスが乱入し、彼から痛烈な尋問（もちろんHである）で暗殺を糾弾されてしまう。{br} この時ランスの放った「忍者は女の子ではない（意訳）」という言葉に、かねてより抱いていた“普通の女の子”への憧れからくる劣等感が大爆発。女々しく泣き喚いたところを今度は逆に慰められ、励まされるすったもんだの展開になってしまうのだった。
  : 风味文本的LP2年（『IV』本篇）对她而言也是波澜万丈的一年。{br} 以「救出被送往谜之浮游都市的兰斯及其奴隶・希尔」为名目，一直厌恶兰斯身边奴隶存在的莉亚暗下抹杀希尔的命令，但她无法无视在『III/03』中与希尔建立的友情，于是向希尔诉说兰斯的恶逆非道，并劝告其离开。{br} 然而希尔表明是自己意志成为他的奴隶，并展现出宁被香美杀死也要为他殉死的强烈意志，最终作罢。这次轮到违背莉亚意志的香美企图自决，就在此时兰斯闯入，以痛烈的追问（当然是H）弹劾暗杀。{br} 此时兰斯所说「忍者不是女孩子（意译）」这句话，使她长久以来对「普通女孩」的憧憬所带来的劣等感大爆发。她哭喊得像个女人，这次反而被安慰、被鼓励，成了这般混乱的展开。
